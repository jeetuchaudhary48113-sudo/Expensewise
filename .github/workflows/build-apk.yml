name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java Version: $JAVA_VER"
          MAJOR_VER=$(echo "$JAVA_VER" | cut -d'.' -f1)
          if [ -z "$MAJOR_VER" ]; then
            echo "ERROR: Could not detect Java major version."
            exit 1
          fi
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher. Found: $MAJOR_VER"
            exit 1
          fi
          echo "Java environment verified successfully: Version $MAJOR_VER (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore missing. Creating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Keystore verified at ./debug.keystore"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK not found!"
            echo "Searching only inside app/build/outputs/apk..."
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK is empty!"
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: Target does not have .apk extension"; exit 1 ;;
          esac
          echo "Verified APK successfully: $TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="$TMP_DIR/app-debug.apk"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_APK"
            exit 1
          fi
          echo "Prepared release asset: $DEST_APK"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK is missing or empty. Skipping release creation."
            exit 1
          fi
          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset name must be app-debug.apk, found $ASSET_NAME"
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Build
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Environment:** Built automatically by GitHub Actions.
          - **Notice:** This is an automatically generated debug APK intended for testing purposes only. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "GitHub Release created successfully!"
            gh release view "$TAG" || true
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Asset: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"

            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download URL: $DIRECT_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The backup Actions artifact \`app-debug-apk\` remains available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation failed or was skipped."
            if [ "${{ steps.upload-artifact.outcome }}" = "success" ] || [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully."
              echo "The GitHub Actions backup artifact \`app-debug-apk\` remains available for download."
            fi
            echo "## Release Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release creation did not complete, but the backup artifact \`app-debug-apk\` is preserved." >> "$GITHUB_STEP_SUMMARY"
          fi
